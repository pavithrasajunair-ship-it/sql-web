<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found – SQL Revision</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#0d0d0d;--panel:#161616;--ink:#f0f0f0;--mute:#a8a8a8;--line:#2e2e2e;--a:#afa9ec;--b:#7f77dd}
@media(prefers-color-scheme:light){:root{--bg:#f6f5fb;--panel:#fff;--ink:#1a1840;--mute:#5a5878;--line:#dcdaf0;--a:#7f77dd;--b:#3c3489}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;text-align:center}
.code{font:800 clamp(4.5rem,18vw,8rem)/1 ui-monospace,Menlo,Consolas,monospace;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
h1{font-size:1.6rem;margin:.4rem 0}
p{color:var(--mute);margin:.5rem 0 1.2rem}
pre{display:block;white-space:pre-wrap;word-break:break-word;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);max-width:100%;overflow:auto;margin:0 0 1.4rem}
pre i{color:var(--a);font-style:normal;font-weight:700}pre u{color:var(--b);text-decoration:none}
.row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:.55rem 1.2rem;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700;text-decoration:none}
a.btn.pri{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}
a:focus-visible{outline:3px solid var(--b);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>This page doesn't exist</h1>
  <p>The link may be mistyped or the page may have moved. Your saved progress is safe.</p>
  <pre><i>SELECT</i> * <i>FROM</i> pages <i>WHERE</i> url = <u>'this one'</u>;
<span style="color:var(--mute)">-- 0 rows returned</span></pre>
  <div class="row"><a class="btn pri" href="/">Back to SQL Revision</a><a class="btn" href="/learnloop/">Open LearnLoop</a></div>
</main>
</body>
</html>
